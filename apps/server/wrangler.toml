# ============================================================
# Server Hono (oRPC + Better Auth) — run lokal / deploy Cloudflare
# Lokal:  wrangler dev --port 3000   (D1 local, migrasi di bawah)
# Migrasi: wrangler d1 migrations apply karir-mulai-plus-db --local
# ============================================================
name = "mulai-plus-server"
main = "src/index.ts"
compatibility_date = "2026-07-29"
compatibility_flags = ["nodejs_compat"]

# Custom domain (mulaiplus.id sudah active di Cloudflare)
workers_dev = true
routes = [
  { pattern = "api.mulaiplus.id", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "karir-mulai-plus-db"
database_id = "3e0a00e7-5156-4e77-9f95-e33ddd2a9c35"
migrations_dir = "../../packages/db/src/migrations"

# Secret (BETTER_AUTH_SECRET) jangan ditaruh di file ini — pakai `wrangler secret put`
# Nilai produksi (untuk deploy). Dev lokal memakai .dev.vars
[vars]
CORS_ORIGIN = "https://app.mulaiplus.id"
BETTER_AUTH_URL = "https://api.mulaiplus.id"
