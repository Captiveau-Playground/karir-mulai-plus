name: Deploy to Cloudflare

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # STAGING — push ke branch `staging` / workflow_dispatch manual
  # ============================================================
  deploy-staging:
    if: github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check-types

      - name: D1 migration (staging)
        working-directory: apps/server
        run: bunx wrangler d1 migrations apply karir-mulai-plus-db-staging --remote --env staging

      - name: Set BETTER_AUTH_SECRET (staging)
        working-directory: apps/server
        run: echo "${{ secrets.BETTER_AUTH_SECRET }}" | bunx wrangler secret put BETTER_AUTH_SECRET --env staging

      - name: Deploy server (staging)
        working-directory: apps/server
        run: bunx wrangler deploy --env staging

      - name: Build web (staging)
        working-directory: apps/web
        run: bun run build:staging

      - name: Deploy web (staging)
        working-directory: apps/web
        run: bunx wrangler deploy

  # ============================================================
  # PRODUCTION — push ke `main` / workflow_dispatch manual
  # ============================================================
  deploy-production:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check-types

      - name: D1 migration (production)
        working-directory: apps/server
        run: bunx wrangler d1 migrations apply karir-mulai-plus-db --remote

      - name: Set BETTER_AUTH_SECRET (production)
        working-directory: apps/server
        run: echo "${{ secrets.BETTER_AUTH_SECRET }}" | bunx wrangler secret put BETTER_AUTH_SECRET

      - name: Deploy server (production)
        working-directory: apps/server
        run: bunx wrangler deploy

      - name: Build web (production)
        working-directory: apps/web
        run: bun run build

      - name: Deploy web (production)
        working-directory: apps/web
        run: bunx wrangler deploy
